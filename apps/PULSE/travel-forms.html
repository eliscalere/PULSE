<script>
  (function () {
    try {
      var savedTheme = String(localStorage.getItem("aewttr_theme") || "").toLowerCase();
      var resolvedTheme = savedTheme === "dark" || savedTheme === "light"
        ? savedTheme
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", resolvedTheme);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
    document.documentElement.setAttribute("data-theme-ready", "true");
  }());

    sidebarTools: [

{ key: "debrief", title: "Submit Debrief", navLabel: "Travel Debrief", sub: "File a debrief for an approved trip.", icon: "bx-receipt" }
    ]
  };
</script>

<!-- Boot loader lives outside #aewttr-root so renderShell() can't wipe it -->
<div id="pulse-boot-loader" role="status" aria-label="Loading PULSE Travel Forms">
  <div class="pulse-svgl-wrap">
    <svg class="pulse-svgl" viewBox="0 0 960 360" aria-hidden="true">
      <g class="pulse-svgl-wordmark">
        <text class="pulse-svgl-letter pulse-svgl-letter--p" x="120" y="180">P</text>
        <text class="pulse-svgl-letter pulse-svgl-letter--u" x="300" y="180">U</text>
        <text class="pulse-svgl-letter pulse-svgl-letter--l" x="480" y="180">L</text>
        <text class="pulse-svgl-letter pulse-svgl-letter--s" x="660" y="180">S</text>
        <text class="pulse-svgl-letter pulse-svgl-letter--e" x="840" y="180">E</text>
      </g>
      <circle class="pulse-svgl-dot pulse-svgl-dot--upper" cx="300" cy="76" r="14" />
      <circle class="pulse-svgl-dot pulse-svgl-dot--lower" cx="660" cy="258" r="14" />
    </svg>
  </div>
</div>

<script>
  window.PULSELoader = {
    finish: function () {
      var el = document.getElementById('pulse-boot-loader');
      if (!el) return;
      /* The app is ready the moment finish() is called - never let the
         loader intercept clicks past this point, even while it fades. */
      el.style.pointerEvents = 'none';
      var removed = false;
      function removeLoader() {
        if (removed) return;
        removed = true;
        el.remove();
      }
      setTimeout(function () {
        try {
          var anim = el.animate(
            [{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.985)' }],
            { duration: 360, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }
          );
          anim.onfinish = removeLoader;
          anim.oncancel = removeLoader;
        } catch (e) {
          removeLoader();
        }
        /* Web Animations never progress while the tab is hidden, so
           onfinish alone can leave the overlay in the DOM forever
           (silently blocking every click under it). Hard fallback. */
        setTimeout(removeLoader, 1200);
      }, 1000);
    }
  };
</script>
